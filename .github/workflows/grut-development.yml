name: GRUT development checks

on:
  push:
    branches: ["codex/grut-cr5-build-test"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install -r development/requirements-test.txt
      - name: Run the development checks
        run: python development/checks.py
      - name: Retain logs and machine-readable results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grut-development-results
          path: development/results/
          if-no-files-found: error
          retention-days: 14
