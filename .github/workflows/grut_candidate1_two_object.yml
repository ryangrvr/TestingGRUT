name: Candidate 1 two-object research

on:
  push:
    branches:
      - codex/grut-candidate1-two-object-20261019
    paths:
      - .github/workflows/grut_candidate1_two_object.yml
      - research/reality_framework/grut_candidate1_two_object_20261019/kernel.cjs
      - research/reality_framework/grut_candidate1_two_object_20261019/run.cjs
      - research/reality_framework/grut_candidate1_two_object_20261019/verify.cjs
      - research/reality_framework/grut_candidate1_two_object_20261019/protocol.json
      - research/reality_framework/grut_candidate1_two_object_20261019/profile.json

permissions:
  contents: write

jobs:
  evolve:
    if: github.ref == 'refs/heads/codex/grut-candidate1-two-object-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/grut-candidate1-two-object-20261019
      - name: Execute frozen suite and numerical verification
        run: |
          node --version
          node research/reality_framework/grut_candidate1_two_object_20261019/run.cjs
          node research/reality_framework/grut_candidate1_two_object_20261019/verify.cjs
      - name: Preserve raw outcomes on this branch
        if: always() && !cancelled()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/reality_framework/grut_candidate1_two_object_20261019/results/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Execute Candidate 1 two-object suite and preserve numerical outcomes [skip ci]'
          git push origin HEAD:refs/heads/codex/grut-candidate1-two-object-20261019
